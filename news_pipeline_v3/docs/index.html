<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 뉴스 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a32;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --text: #f0ede8;
    --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

  header { padding: 48px 40px 32px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  header::before { content: 'AI'; position: absolute; right: -20px; top: -20px; font-size: 200px; font-family: 'Noto Serif KR', serif; font-weight: 700; color: rgba(255,255,255,0.03); line-height: 1; pointer-events: none; }
  .header-tag { font-size: 11px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
  header h1 { font-family: 'Noto Serif KR', serif; font-size: 36px; font-weight: 700; line-height: 1.2; }
  header h1 span { color: var(--accent); }
  .header-sub { font-size: 13px; color: var(--muted); margin-top: 10px; font-weight: 300; }

  main { max-width: 1100px; margin: 0 auto; padding: 48px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .date-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .date-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .date-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .date-card:hover::after { opacity: 1; }

  .card-date-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .card-date { font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 700; color: var(--text); }
  .card-day { font-size: 12px; color: var(--accent); letter-spacing: 0.1em; background: rgba(200,240,96,0.1); padding: 3px 8px; border-radius: 4px; }
  .card-preview { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .card-count { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .card-arrow { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); transition: all 0.2s; }
  .date-card:hover .card-arrow { border-color: var(--accent); color: var(--accent); }

  .latest-badge { font-size: 10px; letter-spacing: 0.1em; color: var(--bg); background: var(--accent); padding: 2px 8px; border-radius: 4px; font-weight: 500; position: absolute; top: 20px; right: 20px; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .date-card { animation: fadeUp 0.4s ease both; }
</style>
</head>
<body>
<header>
  <div class="header-tag">Daily Briefing</div>
  <h1>AI 뉴스 <span>브리핑</span></h1>
  <p class="header-sub">매일 오전 9시 · EXAONE 자동 요약 · 10건</p>
</header>
<main>
  <div class="grid" id="grid">
    <div class="empty"><div class="empty-icon">📭</div>불러오는 중...</div>
  </div>
</main>
<script>
const DAYS = ['일','월','화','수','목','금','토'];
fetch('./index.json')
  .then(r => r.json())
  .then(async data => {
    const grid = document.getElementById('grid');
    if (!data.dates || data.dates.length === 0) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>아직 뉴스가 없습니다.</div>';
      return;
    }
    grid.innerHTML = '';
    for (let i = 0; i < data.dates.length; i++) {
      const date = data.dates[i];
      const d = new Date(date);
      const day = DAYS[d.getDay()] + '요일';
      let preview = '뉴스를 불러오는 중...';
      try {
        const news = await fetch(`./${date}/news.json`).then(r => r.json());
        preview = news.articles.slice(0,3).map(a => a.title).join(' · ');
      } catch(e) { preview = ''; }

      const card = document.createElement('a');
      card.className = 'date-card';
      card.href = `./${date}/`;
      card.style.animationDelay = (i * 0.05) + 's';
      card.innerHTML = `
        ${i === 0 ? '<div class="latest-badge">LATEST</div>' : ''}
        <div class="card-date-row">
          <div class="card-date">${date}</div>
          <div class="card-day">${day}</div>
        </div>
        <div class="card-preview">${preview}</div>
        <div class="card-footer">
          <div class="card-count">AI 뉴스 10건</div>
          <div class="card-arrow">›</div>
        </div>`;
      grid.appendChild(card);
    }
  })
  .catch(() => {
    document.getElementById('grid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>데이터를 불러올 수 없습니다.</div>';
  });
</script>
</body>
</html>
